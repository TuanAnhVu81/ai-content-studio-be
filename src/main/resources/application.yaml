spring:
  application:
    name: ai-content-studio-be
  config:
    import: optional:file:.env[.properties], optional:file:.env
  profiles:
    active: dev

  jackson:
    property-naming-strategy: SNAKE_CASE
    
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aicontent_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate # We will use Flyway for migrations
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  # flyway:
  #   repair-on-migrate: true
  #   validate-on-migrate: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD}
  
  ai:
    model:
      chat: ${AI_PROVIDER:google-genai}
    # Daily development: use Google AI Studio free tier via API key.
    google:
      genai:
        enabled: true
        api-key: ${GEMINI_API_KEY:}
        chat:
          options:
            model: ${GEMINI_MODEL:gemini-3-flash-preview}
            temperature: 0.7
    # Production/demo switch: set AI_PROVIDER=vertexai and keep the GCP settings below.
    vertex:
      ai:
        gemini:
          enabled: false
          project-id: ${GCP_PROJECT_ID:}
          location: ${GCP_LOCATION:us-central1}
          credentials-uri: ${GCP_VERTEX_CREDENTIALS_URI:}
          chat:
            options:
              model: ${GEMINI_MODEL:gemini-2.0-flash}
              temperature: 0.7

springdoc:
  api-docs:
    path: /api/v1/api-docs
  swagger-ui:
    path: /api/v1/docs
    operationsSorter: method

server:
  port: ${PORT:8080}

app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}
  ai:
    model-name: ${GEMINI_MODEL:gemini-2.0-flash}
  jwt:
    secret: ${JWT_SECRET:supersecretkey_that_must_be_at_least_256bits_long_for_hs256}
    access-token-expiration: 1800000    # 30 minutes in milliseconds
    refresh-token-expiration: 604800000 # 7 days in milliseconds
  admin:
    initial-email: ${ADMIN_INITIAL_EMAIL}
    initial-password: ${ADMIN_INITIAL_PASSWORD}
