spring:
  application:
    name: ai-content-studio-be
  config:
    import: optional:file:.env[.properties], optional:file:.env
  profiles:
    active: dev

  jackson:
    property-naming-strategy: SNAKE_CASE
    
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aicontent_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate # We will use Flyway for migrations
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        default_batch_fetch_size: 25

  # flyway:
  #   repair-on-migrate: true
  #   validate-on-migrate: false

  data:
    redis:
      username: ${REDIS_USERNAME:}
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
  
  ai:
    model:
      chat: ${AI_PROVIDER:google-genai}
    # Daily development: use Google AI Studio free tier via API key.
    google:
      genai:
        enabled: true
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: ${app.ai.model-name}
            temperature: 0.7
    # Production/demo switch: set AI_PROVIDER=vertexai and keep the GCP settings below.
    vertex:
      ai:
        gemini:
          enabled: false
          project-id: ${GCP_PROJECT_ID:}
          location: ${GCP_LOCATION:us-central1}
          credentials-uri: ${GCP_VERTEX_CREDENTIALS_URI:}
          chat:
            options:
              model: ${app.ai.model-name}
              temperature: 0.7

springdoc:
  api-docs:
    path: /api/v1/api-docs
  swagger-ui:
    path: /api/v1/docs
    operationsSorter: method

server:
  port: ${PORT:8080}

app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}
  ai:
    model-name: ${GEMINI_MODEL:gemini-3-flash-preview}
  auth:
    refresh-cookie:
      name: ${REFRESH_COOKIE_NAME:refresh_token}
      secure: ${REFRESH_COOKIE_SECURE:true}
      same-site: ${REFRESH_COOKIE_SAME_SITE:None}
      path: ${REFRESH_COOKIE_PATH:/api/v1/auth}
      domain: ${REFRESH_COOKIE_DOMAIN:}
      max-age-seconds: ${REFRESH_COOKIE_MAX_AGE_SECONDS:604800}
    session:
      max-active-sessions-per-user: ${AUTH_MAX_ACTIVE_SESSIONS_PER_USER:5}
      lock-timeout-seconds: ${AUTH_SESSION_LOCK_TIMEOUT_SECONDS:5}
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 1800000    # 30 minutes in milliseconds
    refresh-token-expiration: 604800000 # 7 days in milliseconds
  admin:
    initial-email: ${ADMIN_INITIAL_EMAIL}
    initial-password: ${ADMIN_INITIAL_PASSWORD}
